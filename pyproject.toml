[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geffens-erp"
version = "0.2.0"
description = "Comprehensive ERP domain model implementation for supermarkets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.29",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "geffens_erp*"]

[tool.setuptools.package-data]
"app.web.templates" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
